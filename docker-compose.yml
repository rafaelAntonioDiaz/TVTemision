version: '3.8'

services:
  # --------------------------------------------
  # Servicio de Base de Datos (PostgreSQL)
  # --------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: tvt-db
    environment:
      POSTGRES_DB: tvtdb
      POSTGRES_USER: tvtuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Espera activa para confirmar que Postgres ya acepta conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvtuser -d tvtdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------
  # Servicio de Aplicación (Spring Boot)
  # --------------------------------------------
  app:
    build: .
    image: tvtemision-app:latest
    ports:
      - "8080:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
# --------------------------------------------
# Volúmenes Persistentes
# --------------------------------------------
volumes:
  postgres_data:
  uploads:
  fractals_uploads: