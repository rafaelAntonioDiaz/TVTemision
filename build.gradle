plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.rafaelDiaz'
version = '0.0.1-SNAPSHOT'
description = 'EmisionTVT_FF'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    dependencies {
        // Spring Boot starters
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-mail'

        // Bases de datos
        implementation 'com.h2database:h2' // desarrollo, cambia a postgresql en prod
        implementation 'org.postgresql:postgresql'
        // Hibernate 7 + Logging (necesarias explícitamente para evitar NoClassDefFoundError)
        implementation 'org.jboss.logging:jboss-logging:3.6.1.Final'
        implementation 'org.hibernate.models:hibernate-models:1.1.1'
        implementation 'org.hibernate.common:hibernate-commons-annotations:7.0.3.Final'
        implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
        // iText 7 + html2pdf para el contrato
        implementation 'com.itextpdf:itext7-core:7.2.5'
        implementation 'com.itextpdf:html2pdf:4.0.5'

        // Lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    configurations.all {
        resolutionStrategy {
            force 'org.hibernate.common:hibernate-commons-annotations:7.0.3.Final'
            force 'org.hibernate.models:hibernate-models:1.1.1'
            force 'org.jboss.logging:jboss-logging:3.6.1.Final'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
