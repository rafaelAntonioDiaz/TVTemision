# --- Contenido en español --------------------------------------------------
es:
  tagline: "Facies desde registros de pozo que respetan la geología."
  intro: "Lleva las facies descritas en núcleo a pozos sin núcleo con aprendizaje automático anclado en petrofísica y estratigrafía, y las valida en pozos que el modelo nunca vio."
  problem: "El núcleo describe facies en pocos pozos, mientras los registros existen en casi todos. La interpretación manual es lenta e inconsistente entre intérpretes, y la IA convencional puede ser precisa en validación aleatoria pero colocar facies imposibles, o parpadear entre facies cada media pie, en un pozo nuevo."
  inputs:
    - "Registros convencionales (GR, resistividad, neutrón-densidad, PE)"
    - "Facies descritas en núcleo y láminas delgadas de pozos calibrados"
    - "Restricción geológica opcional (indicador marino/no marino, formación o zona)"
    - "Datos en CSV, Excel o LAS"
  outputs:
    - "Electrofacies por pozo y profundidad"
    - "Modelo de facies calibrado y validado en pozos ciegos"
    - "Métricas de consistencia geológica (violaciones de reglas, realismo de espesores de capa)"
    - "Explicaciones SHAP por facies y por muestra"
  benefits:
    - "Consistencia entre pozos"
    - "Aceleración del flujo de interpretación"
    - "Clasificaciones auditables"
    - "Cero violaciones de reglas geológicas y espesores de capa realistas para el modelo de propiedades"
  evidence:
    - "Demo sintética disponible bajo solicitud."
    - "Benchmark real de facies de núcleo (2 pozos ciegos, 9 facies): F1 ponderado 0.48 vs. 0.41 de ML puro, precisión de facies adyacentes 86% vs. 79%, 0% de violaciones de reglas vs. 2.0%."
    - "Validación leave-one-well-out en 9 pozos: F1 similar entre modelos (0.44–0.47); la ganancia sostenida es geológica."
  tech:
    - "Modelos con restricciones físicas (Vsh, porosidad neutrón-densidad, Archie, índice de carbonato)"
    - "Prior estratigráfico de Markov decodificado con Viterbi"
    - "Red neuronal informada por física con términos geológicos en la función de pérdida"
    - "Random Forest, K-means y mezclas gaussianas"
    - "Explicabilidad por variable (TreeSHAP)"

# --- Contenido en inglés ---------------------------------------------------
en:
  tagline: "Facies from well logs that respect the geology."
  intro: "Carries core-described facies into uncored wells using machine learning anchored in petrophysics and stratigraphy, and validates them on wells the model has never seen."
  problem: "Core describes facies in a handful of wells, while logs exist in almost every well. Manual interpretation is slow and inconsistent across interpreters, and conventional AI can look accurate in random validation yet place impossible facies, or flicker between facies every half foot, in a new well."
  inputs:
    - "Conventional logs (GR, resistivity, neutron-density, PE)"
    - "Core and thin section facies descriptions from calibration wells"
    - "Optional geological constraint (marine/non-marine flag, formation or zone)"
    - "Data in CSV, Excel or LAS"
  outputs:
    - "Electrofacies per well and depth"
    - "Calibrated facies model validated on blind wells"
    - "Geological-consistency metrics (rule violations, bed-thickness realism)"
    - "SHAP explanations per facies and per sample"
  benefits:
    - "Consistency across wells"
    - "Faster interpretation workflow"
    - "Auditable classifications"
    - "Zero geological-rule violations and realistic bed thicknesses for property modelling"
  evidence:
    - "Synthetic demo available on request."
    - "Real core-facies benchmark (2 blind wells, 9 facies): weighted F1 0.48 vs. 0.41 for pure ML, adjacent-facies accuracy 86% vs. 79%, 0% rule violations vs. 2.0%."
    - "Leave-one-well-out validation on 9 wells: F1 close across models (0.44–0.47); the lasting gain is geological."
  tech:
    - "Physics-constrained models (Vsh, neutron-density porosity, Archie, carbonate index)"
    - "Stratigraphic Markov prior decoded with Viterbi"
    - "Physics-informed neural network with geological terms in the loss"
    - "Random Forest, K-means and Gaussian mixtures"
    - "Per-variable explainability (TreeSHAP)"