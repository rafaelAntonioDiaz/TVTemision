# ---------------------------------------------------------------------------
# Ficha de producto: FacieStudio
# Fuente: página de la aplicación "Electrofacies Studio" (Geo Petro Litix AI):
#         predicción de facies físico-informada, validada en pozos ciegos.
# Estructura: metadatos generales + bloque `es` + bloque `en`
#             (ambos bloques deben mantener las mismas claves y el mismo
#              número de elementos en cada lista).
# ---------------------------------------------------------------------------

# --- Metadatos generales ---------------------------------------------------
name: FacieStudio                # Nombre comercial del producto
domain: geologia-geofisica       # Clave de dominio (ES)
domainEn: geology-geophysics     # Clave de dominio (EN)
domainLabelEs: "Geología / Geofísica"
domainLabelEn: "Geology / Geophysics"
slugEs: faciestudio              # Slug de URL en español
slugEn: faciestudio              # Slug de URL en inglés
