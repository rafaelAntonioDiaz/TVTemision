#         descubre una ecuación explícita de DT a partir de registros
#         convencionales; caso de estudio con el dataset abierto Volve.
# Alcance: solo DT COMPRESIONAL (el DT de corte no está respaldado por la
#          fuente y se retiró de la ficha).
