en:
  tagline: "Generates DT curves in wells without sonic."
  intro: "Derives compressional and shear DT curves from conventional logs for porosity calibration, seismic ties and well correlation."
  problem: "Missing DT limits porosity calibration, well correlation and seismic ties in key sectors."
  inputs:
    - "Conventional well logs"
    - "Existing DT curves for calibration"
  outputs:
    - "Compressional and shear DT curves"
    - "Inputs for porosity calibration"
  benefits:
    - "Improves correlation and seismic tie"
    - "Avoids re-logging wells only for DT"
    - "Auditable results"
  evidence:
    - "Synthetic demo available on request."
  tech:
    - "Physics-constrained models"