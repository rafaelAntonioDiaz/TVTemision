en:
  tagline: "Production monitoring and optimization with field data."
  intro: "Consolidates well, surface and pumping equipment data to detect anomalies and recommend optimization actions."
  problem: "Production monitoring is often reactive. Production drops are detected after they have already impacted cumulative volumes."
  inputs:
    - "Wellhead data (pressure, flow rate)"
    - "Pumping equipment data"
  outputs:
    - "Optimization recommendations"
    - "Anomaly alerts"
  benefits:
    - "Less deferred production"
    - "Extended well life"
    - "Traceable decisions"
  evidence:
    - "Synthetic demo available on request."
  tech:
    - "Per-variable explainability"