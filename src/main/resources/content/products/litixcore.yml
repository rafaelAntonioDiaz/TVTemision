# --- Contenido en español --------------------------------------------------
es:
  tagline: "Permeabilidad, litología y unidades de flujo desde registros y NMR, con razonamiento verificable."
  intro: "Aplica ML anclado en petrofísica sobre registros convencionales, NMR e índices de imagen para estimar permeabilidad, clasificar litología y definir unidades de flujo, y revisa el razonamiento de cada modelo contra la teoría petrofísica antes de usarlo."
  problem: "Las transformaciones porosidad–permeabilidad y los crossplots de una variable asumen relaciones simples que los yacimientos reales no cumplen: en carbonatos, la misma porosidad puede dar permeabilidades que difieren en órdenes de magnitud por diagénesis, vúgulos y fracturas. La litología y las facies de flujo dependen de interacciones no lineales entre minerales, fluidos y geometría de poro."
  inputs:
    - "Registros convencionales (GR, RHOB, NPHI, DT, PEF, resistividad)"
    - "Particiones de tamaño de poro NMR (T2), índice de fluido libre y Swirr"
    - "Índices de imagen de pozo (vúgulos y fracturas) y volúmenes minerales"
    - "Tipo de roca y datos de núcleo para calibración"
  outputs:
    - "Permeabilidad (log10 k) y clasificación de calidad de yacimiento (k > 1 mD)"
    - "Litología (arenisca, lutita, caliza, dolomía)"
    - "Facies y unidades de flujo por NMR, incluidas barreras delgadas"
    - "Explicación SHAP de cada predicción para su verificación"
  benefits:
    - "Mejor tipificación de roca, definición de unidades de flujo y estimaciones de permeabilidad para el modelo de yacimiento"
    - "Estimaciones confiables en carbonatos heterogéneos, donde fallan las transformaciones simples"
    - "Clasificación litológica rápida y consistente en cientos de pozos"
    - "Resultados auditables variable por variable"
  evidence:
    - "Demo sintética disponible bajo solicitud. Resultados ilustrativos con datos sintéticos anclados en física real, no datos reales."
    - "Permeabilidad (2,400 muestras, 5 tipos de roca carbonática, 10⁴× de rango dinámico): R² 0.934 con SVR y ROC-AUC 0.98–0.99 para k > 1 mD."
    - "Litología (3,600 muestras, 4 clases, 7 registros): 96.7 % de exactitud con SVM; los errores se concentran en el límite caliza–dolomía."
    - "Facies NMR (1,560 muestras, 4 zonas): 98.4 % de exactitud con XGBoost, corroborado por dos marcos AutoML independientes."
  tech:
    - "Atributos anclados en física de minerales y de roca (PEF, NMR, volúmenes minerales)"
    - "Cinco algoritmos (Random Forest, XGBoost, Gradient Boosting, SVM/SVR y redes neuronales) con optimización bayesiana y validación cruzada de 5 pliegues"
    - "Verificación del ranking SHAP contra la teoría petrofísica antes de confiar en el modelo"
    - "Explicabilidad total por variable (SHAP)"

# --- Contenido en inglés ---------------------------------------------------
en:
  tagline: "Permeability, lithology and flow units from logs and NMR, with verifiable reasoning."
  intro: "Applies petrophysics-anchored ML to conventional logs, NMR and image-log indices to estimate permeability, classify lithology and define flow units, and checks each model's reasoning against petrophysical theory before it is used."
  problem: "Porosity–permeability transforms and single-variable crossplots assume simple relationships that real reservoirs do not follow: in carbonates, the same porosity can give permeabilities that differ by orders of magnitude because of diagenesis, vugs and fractures. Lithology and flow facies depend on non-linear interactions between minerals, fluids and pore geometry."
  inputs:
    - "Conventional logs (GR, RHOB, NPHI, DT, PEF, resistivity)"
    - "NMR T2 pore-size partitions, free-fluid index and Swirr"
    - "Image-log indices (vugs and fractures) and mineral volumes"
    - "Rock type and core data for calibration"
  outputs:
    - "Permeability (log10 k) and reservoir-quality classification (k > 1 mD)"
    - "Lithology (sandstone, shale, limestone, dolomite)"
    - "NMR facies and flow units, including thin baffles"
    - "SHAP explanation of every prediction for verification"
  benefits:
    - "Better rock typing, flow-unit definition and permeability estimates for the reservoir model"
    - "Reliable estimates in heterogeneous carbonates, where simple transforms break down"
    - "Fast, consistent lithology calls across hundreds of wells"
    - "Variable-by-variable auditable results"
  evidence:
    - "Synthetic demo available on request. Illustrative results with synthetic data anchored in real physics, not real data."
    - "Permeability (2,400 samples, 5 carbonate rock types, 10⁴× dynamic range): R² 0.934 with SVR and ROC-AUC 0.98–0.99 for k > 1 mD."
    - "Lithology (3,600 samples, 4 classes, 7 logs): 96.7% accuracy with SVM; errors concentrate at the limestone–dolomite boundary."
    - "NMR facies (1,560 samples, 4 zones): 98.4% accuracy with XGBoost, corroborated by two independent AutoML frameworks."
  tech:
    - "Features anchored in mineral and rock physics (PEF, NMR, mineral volumes)"
    - "Five algorithms (Random Forest, XGBoost, Gradient Boosting, SVM/SVR and neural networks) with Bayesian optimization and 5-fold cross-validation"
    - "SHAP ranking checked against petrophysical theory before the model is trusted"
    - "Full per-variable explainability (SHAP)"