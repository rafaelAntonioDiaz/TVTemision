<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page-head}, ~{::main}, 'es')}">
<head>
    <title>Soluciones — Geo Petro Litix AI</title>
    <th:block id="page-head">
        <link rel="canonical" href="https://www.geopetrolitixai.pro/soluciones"/>
        <link rel="alternate" hreflang="es" href="https://www.geopetrolitixai.pro/soluciones"/>
        <link rel="alternate" hreflang="en" href="https://www.geopetrolitixai.pro/en/solutions"/>
        <link rel="alternate" hreflang="x-default" href="https://www.geopetrolitixai.pro/soluciones"/>
        <meta name="description" content="Soluciones de Geo Petro Litix AI: geología, geofísica, yacimientos, reservas, perforación y producción. Implementaciones en 4 a 6 semanas."/>
    </th:block>
</head>
<body>
<main class="container my-5">

    <section class="card-custom hero-card mb-5 text-center">
        <h1 class="mb-3">Soluciones</h1>
        <p class="hero-lead mb-2">
            <strong>El CAPEX se reduce donde el dato se aprovecha.</strong>
        </p>
        <p class="mb-0">
            Nueve productos, cuatro dominios. Todos parten de la información que ya tienes.
        </p>
    </section>

    <!-- Iteramos por dominio -->
    <section th:each="entry : ${productsByDomain}" class="mb-5">
        <div class="d-flex align-items-center mb-3">
            <h2 class="h3 mb-0 me-3" th:text="${entry.value[0].domainLabelEs}">Dominio</h2>
            <span class="badge-tech"
                  th:text="${entry.value.size()} + ' productos'">N productos</span>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="p : ${entry.value}">
                <div class="card-custom h-100 mb-0 d-flex flex-column">
                    <h3 class="h5 mb-2" th:text="${p.name()}">Nombre</h3>
                    <p class="small mb-3" th:text="${p.es().tagline()}">Tagline</p>
                    <a th:href="@{'/soluciones/' + ${p.domain()} + '/' + ${p.slugEs()}}"
                       class="mt-auto fw-bold small">Ver detalle →</a>
                </div>
            </div>
        </div>
    </section>

    <section class="contact-highlight text-center">
        <p class="mb-2"><strong>¿Hablamos de tu activo?</strong></p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="tel:+573132203002" class="btn btn-primary btn-lg mb-2">📞 Llamar ahora</a>
            <a href="https://wa.me/573132203002?text=Hola%2C%20quiero%20hablar%20sobre%20el%20valor%20de%20los%20datos%20de%20mi%20activo."
               class="btn btn-whatsapp btn-lg mb-2" target="_blank" rel="noopener">💬 WhatsApp</a>
            <a href="mailto:rafael.diaz@geopetrolitixai.pro?subject=Consulta%20desde%20el%20sitio%20web"
               class="btn btn-outline-navy btn-lg mb-2">✉️ Email</a>
        </div>
    </section>

</main>
</body>
</html>
