<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Invitación</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1b263b; color: #fff; }
        .navbar { background: #0d1b2a !important; }
        .navbar-brand { color: #ffd966 !important; font-weight: bold; }
        .card { background: #111; border: 1px solid #415a77; }
        .btn-primary { background: #e9c46a; border-color: #e9c46a; color: #000; font-weight: 600; }
        .btn-primary:hover { background: #f4a261; border-color: #f4a261; }
        .btn-secondary { background: #415a77; border-color: #415a77; color: #fff; }
        .form-label { color: #fff; }
        .form-control { background: #1b263b; color: #fff; border: 1px solid #415a77; }
        .form-select { background: #1b263b; color: #fff; border: 1px solid #415a77; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">Geo-IA Admin</a>
        <a href="/admin" class="btn btn-secondary">Cancelar</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title mb-4">Crear nueva invitación</h3>
                    <form th:action="@{/admin/create-invite}" method="post">
                        <div class="mb-3">
                            <label for="roundId" class="form-label">Ronda</label>
                            <select name="roundId" id="roundId" class="form-select" required>
                                <option value="">Selecciona una ronda</option>
                                <option th:each="round : ${rounds}" th:value="${round.id}"
                                        th:text="${round.name} + ' - $' + ${round.priceUsd} + ' USD (máx ' + ${round.maxTokensPerInvestor} + ' tokens)'">
                                    F&F
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="maxQuantity" class="form-label">Cantidad máxima de tokens para este inversor</label>
                            <input type="number" name="maxQuantity" id="maxQuantity" class="form-control" min="1" value="5" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Crear invitación</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
