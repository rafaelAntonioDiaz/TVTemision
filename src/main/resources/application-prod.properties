# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/tvtdb
spring.datasource.username=tvtuser
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Subida de archivos (ruta dentro del contenedor)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=/app/uploads/
app.upload.fractals.dir=/app/uploads/fractals/

# URL base de la aplicación (cambiar por tu dominio real)
app.base-url=https://geopetrolitixai.pro

# Seguridad admin (se toman de variables de entorno)
app.admin.username=${ADMIN_USER}
app.admin.password=${ADMIN_PASSWORD}