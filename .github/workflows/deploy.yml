name: Docker Build & Deploy to GCP

on:
  push:
    branches:
      - main  # Se activa al hacer 'git push' a la rama main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: ☕ Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: ⚙️ Compilar el proyecto (JAR)
        run: ./gradlew bootJar -x test

      - name: 📋 Copiar JAR a la raíz (para el Dockerfile)
        run: cp build/libs/EmisionTVT_FF-0.0.1-SNAPSHOT.jar app.jar

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true  # <-- Para evitar que use la caché del slim antiguo
          pull: true      # <-- Fuerza a descargar la versión correcta sin -slim
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tvtemision:latest

  deploy-to-gcp:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en la VM vía SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            # 1. Navegar al repositorio en la VM
            cd ~/TVTemision

            # 2. Actualizar el repositorio para tener el docker-compose.yml al día
            git pull origin main

            # 3. Descargar la última imagen compilada
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tvtemision:latest

            # 4. Reiniciar los servicios usando Docker Compose (agrega --remove-orphans para evitar conflictos)
            sudo docker compose down --remove-orphans
            sudo docker compose up -d

            # 5. Limpieza de imágenes viejas para proteger el disco de 10GB
            sudo docker system prune -f