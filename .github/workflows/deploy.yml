name: 🚀 Deploy Robusto a GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: ⚙️ Compilar el proyecto (JAR)
        run: ./gradlew bootJar -x test

      # Configuramos el agente SSH con la llave privada
      - name: 🔑 Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_VM_SSH_KEY }}

      - name: 📤 Subir JAR a la VM (scp directo)
        run: |
          scp -o StrictHostKeyChecking=no \
            build/libs/EmisionTVT_FF-0.0.1-SNAPSHOT.jar \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:/home/rafael_diaz/TVTemision/app.jar

      - name: 🐳 Construir y desplegar en la VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/TVTemision
            git pull origin main
            sudo docker compose build app --no-cache
            sudo docker compose up -d --force-recreate app
            sudo docker system prune -f